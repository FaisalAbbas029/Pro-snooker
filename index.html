<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preload" href="videos/snooker-hero.mp4" as="video" type="video/mp4">

    <div style="position:fixed;inset:0;background:#0a1c12;display:flex;align-items:center;justify-content:center;z-index:9999;">
      <div style="text-align:center;">
        <div style="font-family:'Playfair Display',Georgia,serif;font-size:3rem;color:#b8863c;font-style:italic;letter-spacing:2px;">P</div>
        <div style="font-size:9px;letter-spacing:4px;color:rgba(255,255,255,0.35);text-transform:uppercase;margin-top:8px;">Pro Snooker Club</div>

    </div>
